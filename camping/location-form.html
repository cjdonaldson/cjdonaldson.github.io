<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florida Bound Location Entry Form</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="url"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 0.5em;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        #bookingUrl:disabled {
            background-color: #f0f0f0;
            border-color: #d0d0d0;
            color: #bbb;
            cursor: not-allowed;
        }

        #bookingUrl:not(:disabled) {
            background-color: #fff;
            transition: background-color 0.25s;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .coords-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row {
            display: grid;
            gap: 15px;
            margin-bottom: 20px;
        }

        .form-row > .form-group {
            margin-bottom: 0;
        }

        @media (max-width: 399px) {
            .form-row {
                grid-template-columns: 1fr !important;
            }
            .addr-row {
                flex-direction: column;
                align-items: stretch;
            }
            .addr-row input {
                width: 100% !important;
            }
        }

        .addr-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin-bottom: 20px;
        }

        .addr-row > div {
            display: flex;
            flex-direction: column;
        }

        .addr-row > div label {
            margin-bottom: 6px;
        }

        .addr-street {
            flex: 1;
            min-width: 0;
        }

        .addr-row input[name="siteMap"]   { width: 18em; }
        .addr-row input[name="city"]      { width: 10em; }
        .addr-row input[name="state"]     { width: 3em; }
        .addr-row input[name="zip"]       { width: 5em; }
        .addr-row input[name="latitude"] { width: 9em; }
        .addr-row input[name="longitude"] { width: 9em; }
        .addr-row input[name="phone"]     { width: 8em; }
        .addr-row input[name="email"]     { width: 32em; }
        .addr-row input[name="emailName"] { width: 10em; }
        .addr-row input[name="bookingUrl"] { width: 42em; }

        .array-input {
            margin-bottom: 10px;
        }

        .array-input input {
            margin-bottom: 8px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #6c757d;
            margin-left: 10px;
        }

        .output {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 6px;
            border: 2px solid #e0e0e0;
            display: none;
        }

        .output.show {
            display: block;
        }

        .output pre {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 20px;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        .copy-btn {
            background: #28a745;
            padding: 8px 16px;
            font-size: 14px;
            margin-top: 10px;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .section-header {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-top: 30px;
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e0e0e0;
        }

        .section-header:first-of-type {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏕️ Location Entry Form</h1>
        <p class="subtitle">Fill out the details for a new camping location</p>

        <form id="locationForm">
            <div class="section-header">Overview</div>

            <div class="form-row" style="grid-template-columns: 3fr 1fr">
                <div class="form-group">
                    <label for="name">Name *</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="emoji">Emoji</label>
                    <input type="text" id="emoji" name="emoji" placeholder="🏕️" maxlength="2">
                </div>
            </div>

            <div class="addr-row">
                <div class="addr-street">
                    <label for="url">Website URL *</label>
                    <input type="url" id="url" name="url" required placeholder="https://example.com">
                </div>
                <div>
                    <label for="siteMap">Site Map</label>
                    <input type="text" id="siteMap" name="siteMap" placeholder="./site-map/LocationName.pdf">
                </div>
            </div>

            <div class="addr-row">
                <div>
                    <label for="bookingMethod">Reservation</label>
                    <select id="bookingMethod" name="bookingMethod" onchange="updateBookingVisibility()">
                        <option value="callToBook">Call to Book</option>
                        <option value="bookOnline">Book Online</option>
                    </select>
                </div>
                <div>
                    <label for="bookingUrl">&nbsp;</label>
                    <input type="url" id="bookingUrl" name="bookingUrl" placeholder="https://..." disabled>
                </div>
            </div>

            <div class="section-header">Location *</div>

            <div class="addr-row">
                <div class="addr-street">
                    <label for="mapUrl">Google Maps URL</label>
                    <input type="url" id="mapUrl" name="mapUrl" required placeholder="https://maps.app.goo.gl/...">
                </div>
                <div>
                    <label for="latitude">Latitude</label>
                    <input type="number" id="latitude" name="latitude" step="any" required placeholder="27.1392">
                </div>
                <div>
                    <label for="longitude">Longitude</label>
                    <input type="number" id="longitude" name="longitude" step="any" required placeholder="-82.4526">
                </div>
            </div>

            <div class="addr-row">
                <div class="addr-street">
                    <label for="address">Street Address</label>
                    <input type="text" id="address" name="address" required placeholder="123 Fake St">
                </div>
                <div>
                    <label for="city">City</label>
                    <input type="text" id="city" name="city" required placeholder="Fake Place">
                </div>
                <div>
                    <label for="state">State</label>
                    <input type="text" id="state" name="state" required placeholder="FL" maxlength="2">
                </div>
                <div>
                    <label for="zip">ZIP Code</label>
                    <input type="text" id="zip" name="zip" required placeholder="12345">
                </div>
            </div>

            <div class="section-header">Contact</div>

            <div class="addr-row">
                <div>
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" name="phone" placeholder="222-321-4123">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="joe@email.com">
                </div>
                <div>
                    <label for="emailName">Email Contact Name</label>
                    <input type="text" id="emailName" name="emailName" placeholder="Joe">
                </div>
            </div>

            <div class="form-group">
                <label for="hours">Hours</label>
                <input type="text" id="hours" name="hours" placeholder="Mon-Fri 8am-8pm | Sat-Sun 9:30am-6pm">
            </div>

            <div class="section-header">Additional Details</div>

            <div class="form-group">
                <label for="season">Season</label>
                <input type="text" id="season" name="season" placeholder="Year round">
            </div>

            <div class="form-group">
                <label for="distances">Distances (one per line; enter each feature on a new line)</label>
                <textarea id="distances" name="distances" placeholder="429 mi • 7 hrs from Smith Mountain&#10;300 mi • 5 hrs to Papa Lew's"></textarea>
            </div>

            <div class="form-group">
                <label for="features">Features (one per line; enter each feature on a new line)</label>
                <textarea id="features" name="features" placeholder="RV propane fill&#10;RV Dump Station&#10;Good Sam Discount"></textarea>
            </div>

            <div class="form-group">
                <label for="notes">Notes (one per line; enter each feature on a new line)</label>
                <textarea id="notes" name="notes" placeholder="Private&#10;Members only"></textarea>
            </div>

            <div class="form-group">
                <label for="defaultStart">Default Start Location</label>
                <select id="defaultStart" name="defaultStart">
                    <option value="">No</option>
                    <option value="true">Yes</option>
                </select>
            </div>

            <button type="submit" class="btn">Generate JSON</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()">Clear Form</button>
        </form>

        <div class="output" id="output">
            <h3>Generated JSON:</h3>
            <pre id="jsonOutput"></pre>
            <button type="button" class="btn copy-btn" onclick="copyToClipboard()">📋 Copy to Clipboard</button>
        </div>
    </div>

    <script>
        function updateBookingVisibility() {
            const urlInput = document.getElementById('bookingUrl');
            urlInput.disabled = document.getElementById('bookingMethod').value !== 'bookOnline';
        }

        document.getElementById('locationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!crypto.subtle) {
                document.getElementById('jsonOutput').textContent = 'ID generation is not supported in this context. Please open this file in Firefox, or serve it over HTTP/HTTPS.';
                document.getElementById('output').classList.add('show');
                return;
            }

            const formData = new FormData(e.target);

            const lat4 = parseFloat(formData.get('latitude')).toFixed(4);
            const lng4 = parseFloat(formData.get('longitude')).toFixed(4);
            const coordStr = `${lat4},${lng4}`;
            const bytes = new TextEncoder().encode(coordStr);
            const hashBuffer = await crypto.subtle.digest('SHA-256', bytes);
            const hexStr = Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
            const id = hexStr.slice(0, 8);

            const location = { id };                                                       // pos  1

            location.name = formData.get('name').trim();                                   // pos  2

            const emoji = formData.get('emoji')?.trim();
            if (emoji) location.emoji = emoji;                                             // pos  3

            location.url = formData.get('url').trim();                                     // pos  4

            const siteMap = formData.get('siteMap')?.trim();
            if (siteMap) location.siteMap = siteMap;                                       // pos  5

            location.mapUrl = formData.get('mapUrl').trim();                               // pos  6

            // Booking URL (only when Book Online is active and non-empty)
            if (document.getElementById('bookingMethod').value === 'bookOnline') {
                const bUrl = document.getElementById('bookingUrl').value.trim();
                if (bUrl) location.bookingUrl = bUrl;                                      // pos  7
            }

            const phone = formData.get('phone')?.trim();
            if (phone) location.phone = phone;                                             // pos  8

            const email = formData.get('email')?.trim();
            if (email) location.email = email;                                             // pos  9

            const emailName = formData.get('emailName')?.trim();
            if (emailName) location.emailName = emailName;                                 // pos 10

            location.address = formData.get('address').trim();                             // pos 11

            location.city = formData.get('city').trim();                                   // pos 12

            location.state = formData.get('state').trim().toUpperCase();                   // pos 13

            location.zip = formData.get('zip').trim();                                     // pos 14

            location.coords = [                                                            // pos 15
                parseFloat(lat4),
                parseFloat(lng4)
            ];

            // pricing (pos 16) — not in form; omitted intentionally

            const hours = formData.get('hours')?.trim();
            if (hours) location.hours = hours;                                             // pos 17

            const season = formData.get('season')?.trim();
            if (season) location.season = season;                                          // pos 18

            const distancesRaw = formData.get('distances')?.trim();
            if (distancesRaw) {
                const dArr = distancesRaw.split('\n').map(item => item.trim()).filter(item => item.length > 0);
                if (dArr.length > 0) location.distances = dArr;                            // pos 19
            }

            const featuresRaw = formData.get('features')?.trim();
            if (featuresRaw) {
                const fArr = featuresRaw.split('\n').map(item => item.trim()).filter(item => item.length > 0);
                if (fArr.length > 0) location.features = fArr;                             // pos 20
            }

            const notesRaw = formData.get('notes')?.trim();
            if (notesRaw) {
                const nArr = notesRaw.split('\n').map(item => item.trim()).filter(item => item.length > 0);
                if (nArr.length > 0) location.notes = nArr;                                // pos 21
            }

            const defaultStart = formData.get('defaultStart');
            if (defaultStart === 'true') location.defaultStart = true;                    // pos 22

            // Display JSON
            const jsonString = JSON.stringify(location, null, 2);
            document.getElementById('jsonOutput').textContent = jsonString;
            document.getElementById('output').classList.add('show');

            // Scroll to output
            document.getElementById('output').scrollIntoView({ behavior: 'smooth' });
        });

        function copyToClipboard() {
            const text = document.getElementById('jsonOutput').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                btn.style.background = '#218838';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '#28a745';
                }, 2000);
            });
        }

        function resetForm() {
            document.getElementById('locationForm').reset();
            document.getElementById('output').classList.remove('show');
            document.getElementById('bookingMethod').value = 'callToBook';
            document.getElementById('bookingUrl').value = '';
            document.getElementById('bookingUrl').disabled = true;
        }
    </script>
</body>
</html>
