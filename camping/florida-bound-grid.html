<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Florida Bound - Distance Grid</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="florida-bound-grid.css">
    </head>
    <body>

        <div class="grid-container">
            <h1>Florida Bound - Distance & Time Grid</h1>
            <p>Distances calculated as straight-line (as the crow flies). Time calculated at 60 mph constant velocity.</p>

            <div style="margin-bottom: 15px;">
                <label for="start-location-select">Starting Location: </label>
                <select id="start-location-select" onchange="buildDistanceTable()">
                </select>
                <span style="margin-left: 20px;">
                    <label for="sort-order-select">Sort by Distance: </label>
                    <select id="sort-order-select" onchange="buildDistanceTable()">
                        <option value="asc" selected>Ascending</option>
                        <option value="desc">Descending</option>
                    </select>
                </span>
            </div>

            <table class="distance-grid">
                <thead></thead>
                <tbody></tbody>
            </table>

            <p><a href="florida-bound-planner.html">Route Planner</a></p>
            <p><a href="florida-bound.html">← Back to Florida Bound Destinations</a></p>
        </div>

        <script src="florida-bound-data-loader.js"></script>
        <script src="florida-bound-utils.js"></script>
        <script src="florida-bound-table.js"></script>

    </body>
</html>
